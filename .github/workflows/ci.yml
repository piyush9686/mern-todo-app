name: MERN Todo CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install   

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install  

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Build Backend Docker Image
        run: |
          docker build -t todo-backend ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t todo-frontend ./frontend 

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}


      - name: Push Backend Docker Image
        run: |
          docker tag todo-backend ${{ secrets.DOCKER_USERNAME }}/todo-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/todo-backend:latest

      - name: Push Frontend Docker Image
        run: |  
          docker tag todo-frontend ${{ secrets.DOCKER_USERNAME }}/todo-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/todo-frontend:latest    

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/mern-todo
            git pull origin main

            echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" > backend/.env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend/.env
            echo "PORT=${{ secrets.PORT }}" >> backend/.env
            sudo docker-compose down
            sudo docker-compose pull
            sudo docker-compose up -d    